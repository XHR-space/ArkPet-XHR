name: Build Windows and macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run dist:ci

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe

  build-macos:
    name: build-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Confirm build architecture
        run: |
          uname -m
          test "$(node -p "process.arch")" = "${{ matrix.arch }}"

      - name: Install dependencies with optional native packages
        run: npm ci --include=optional

      - name: Verify native dependencies
        run: |
          test -d "node_modules/@img/sharp-darwin-${{ matrix.arch }}"
          test -d "node_modules/@img/sharp-libvips-darwin-${{ matrix.arch }}"

      - name: Build macOS installer
        run: npm run check && npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Verify packaged runtime
        env:
          EXPECTED_MAC_ARCH: ${{ matrix.arch }}
        run: |
          app="$(find release -name '*.app' -type d -print -quit)"
          test -n "$app"
          test -d "$app/Contents/Resources/app/node_modules/@img/sharp-darwin-${{ matrix.arch }}"
          test -d "$app/Contents/Resources/app/node_modules/@img/sharp-libvips-darwin-${{ matrix.arch }}"
          binary="$(find "$app/Contents/MacOS" -type f -print -quit)"
          ELECTRON_RUN_AS_NODE=1 "$binary" "$app/Contents/Resources/app/scripts/verify-sharp.cjs"

      - name: Upload macOS ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: release/*.dmg

  publish-release:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: package
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: ArkPet ${{ steps.package.outputs.version }}
          body: |
            ArkPet ${{ steps.package.outputs.version }}

            【中文说明】
            ArkPet 2.0.1 维护更新，Windows 与 macOS 安装包均已提供。

            主要变更：
            - 修复点击或拖动桌宠时，其他软件画面停止刷新的问题；桌宠交互期间保持鼠标穿透，并通过全局拖动跟踪继续移动角色
            - 修复桌宠实际点击区域与角色档案中的碰撞区域不同步，以及角色左右转身后碰撞框位置错误的问题
            - 优化配置保存：连续操作合并写盘，状态更新耗时由约 30ms 降至约 1.3ms
            - 优化管理窗口性能：角色预览限制为 30 帧，窗口隐藏后暂停渲染，降低软件使用过程中的卡顿
            - 更新仓库地址、作者信息和自动更新目标为新 GitHub 账号 XHR-space
            - 保持 2.0.0 的用户数据目录、发行种子和更新兼容性，不包含个人模型、API 密钥、声音样本或使用记录

            【English】
            ArkPet 2.0.1 is a maintenance release. Windows and macOS installers are included.

            Highlights:
            - Fixed other applications freezing visually while the desktop pet is clicked or dragged; the overlay now remains mouse-transparent during interaction and uses global drag tracking to move the character
            - Fixed the desktop interaction area not matching the configured collision box, including incorrect hitbox placement after turning left or right
            - Optimized state persistence by coalescing writes; state updates now take about 1.3ms instead of about 30ms
            - Improved management-window performance with a 30 FPS character preview and suspended rendering while the window is hidden
            - Updated repository, author, and auto-update references to the new GitHub account XHR-space
            - Preserved 2.0.0 user-data paths, release seed, and update compatibility; no personal models, API keys, voice samples, or usage history are included
          overwrite_files: true
          files: release-files/*
