name: Build Windows and macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run dist:ci

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe

  build-macos:
    name: build-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Confirm build architecture
        run: |
          uname -m
          test "$(node -p "process.arch")" = "${{ matrix.arch }}"

      - name: Install dependencies with optional native packages
        run: npm ci --include=optional

      - name: Verify native dependencies
        run: |
          test -d "node_modules/@img/sharp-darwin-${{ matrix.arch }}"
          test -d "node_modules/@img/sharp-libvips-darwin-${{ matrix.arch }}"

      - name: Build macOS installer
        run: npm run check && npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Verify packaged runtime
        env:
          EXPECTED_MAC_ARCH: ${{ matrix.arch }}
        run: |
          app="$(find release -name '*.app' -type d -print -quit)"
          test -n "$app"
          test -d "$app/Contents/Resources/app/node_modules/@img/sharp-darwin-${{ matrix.arch }}"
          test -d "$app/Contents/Resources/app/node_modules/@img/sharp-libvips-darwin-${{ matrix.arch }}"
          binary="$(find "$app/Contents/MacOS" -type f -print -quit)"
          ELECTRON_RUN_AS_NODE=1 "$binary" "$app/Contents/Resources/app/scripts/verify-sharp.cjs"

      - name: Upload macOS ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: release/*.dmg

  publish-release:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: package
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: ArkPet-XHR ${{ steps.package.outputs.version }}
          body: |
            ArkPet-XHR ${{ steps.package.outputs.version }}

            【中文说明】
            在 1.1.0 基础上叠加的功能与修复版本，Windows 与 macOS 安装包均已提供。

            主要变更：
            - 语音合成改用 GPU（CUDA 12.8 / RTX 50 系 sm_120），合成速度明显提升；检测不到可用显卡时自动回退 CPU
            - 语音对话改为按句流式合成、边说边播；打开语音即预热识别与合成，首句出声更快
            - 语音对话支持自动断句（停顿即结束）与全双工打断（它说话时你开口即可打断）
            - 攀爬模组修复：跳跃间隔设置真正生效，连爬达到上限后会自动下来，解绑模组立即停止攀爬
            - 模组管理新增「最多连爬层数」设置
            - 显示画面调试与角色大小解耦：画面宽高只控制画布，角色宽高控制角色大小
            - 发布包不再包含本地模型与个人设置，初始只带前 5 只桌宠（种子数据约 6.5MB）
            - 本地模型改为按需加载、空闲 10 分钟自动释放，降低常驻内存
            - 清理调试视频、截图、日志与死代码，减小仓库与运行开销

            【English】
            A feature and fix release stacked on top of 1.1.0. Windows and macOS installers are included.

            Highlights:
            - Voice synthesis now runs on the GPU (CUDA 12.8 / sm_120 for RTX 50 series) for noticeably faster speech, with automatic CPU fallback when no supported GPU is detected.
            - Voice chat now synthesizes sentence by sentence and plays audio while the reply is still being generated. Opening voice chat pre-warms recognition and synthesis so the first sentence starts sooner.
            - Voice chat supports automatic end-of-speech (finishes on silence) and full-duplex barge-in (start talking while the pet speaks to interrupt it).
            - Climb module fixes: the jump interval setting is now respected, the pet comes back down after reaching the climb limit, and unbinding the module stops climbing immediately.
            - New "maximum climb steps" setting in the module manager.
            - Display frame and character size are decoupled: frame width/height controls only the canvas, while character width/height controls the actual pet size.
            - Release builds no longer ship local models or personal settings, and start with the first five pets only (about 6.5 MB of seed data).
            - Local models now load on demand and are released after 10 minutes of inactivity, reducing resident memory.
            - Removed debug videos, screenshots, logs and dead code to shrink both the repository and runtime overhead.
          overwrite_files: true
          files: release-files/*
