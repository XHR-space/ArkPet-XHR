name: Build Windows and macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run dist:ci

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe

  build-macos:
    name: build-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Confirm build architecture
        run: |
          uname -m
          test "$(node -p "process.arch")" = "${{ matrix.arch }}"

      - name: Install dependencies with optional native packages
        run: npm ci --include=optional

      - name: Verify native dependencies
        run: |
          test -d "node_modules/@img/sharp-darwin-${{ matrix.arch }}"
          test -d "node_modules/@img/sharp-libvips-darwin-${{ matrix.arch }}"

      - name: Build macOS installer
        run: npm run check && npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Verify packaged runtime
        env:
          EXPECTED_MAC_ARCH: ${{ matrix.arch }}
        run: |
          app="$(find release -name '*.app' -type d -print -quit)"
          test -n "$app"
          test -d "$app/Contents/Resources/app/node_modules/@img/sharp-darwin-${{ matrix.arch }}"
          test -d "$app/Contents/Resources/app/node_modules/@img/sharp-libvips-darwin-${{ matrix.arch }}"
          binary="$(find "$app/Contents/MacOS" -type f -print -quit)"
          ELECTRON_RUN_AS_NODE=1 "$binary" "$app/Contents/Resources/app/scripts/verify-sharp.cjs"

      - name: Upload macOS ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: release/*.dmg

  publish-release:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: package
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: ArkPet ${{ steps.package.outputs.version }}
          body: |
            ArkPet ${{ steps.package.outputs.version }}

            【中文说明】
            ArkPet 2.3.0 功能更新，Windows 与 macOS 安装包均已提供。

            主要变更：
            - 每个角色拥有独立交互窗口，拖动、抛掷、弹跳、落地、点击穿透、角色互撞与位置落库全部重做，体验更顺滑
            - 落定 v3 三框布局（角色、舞台、说话框），修复舞台不显示角色的问题，高级设置编辑器完整支持
            - 新增角色档案记忆日志：对话与关键互动自动记录，角色每次开口前会先总结记忆再回复，满 50 条自动压缩
            - 模组平台下发与记忆写入接口，模组可自行决定是否把对话写入角色记忆
            - 数据安全页改版为卡片形式，新增“更改数据位置”，可手动把数据迁移到新目录，重启后生效
            - 保持 2.2.x 数据兼容性；发行包不包含个人模型、API 密钥、声音样本或使用记录

            【English】
            ArkPet 2.3.0 is a feature update. Windows and macOS installers are included.

            Highlights:
            - Each character now has its own interactive window; drag, throw, bounce, landing, click-through, collision between characters, and position persistence were all rebuilt
            - Finalized the v3 three-frame layout (character, stage, speech); fixed characters not showing on stage; full support in the advanced settings editor
            - New character-profile memory log: conversations and key interactions are recorded automatically, and characters summarize their memories before every reply; auto-compacts at 50 entries
            - Module platform distribution and a memory API let modules decide whether to write conversations into character memory
            - Redesigned the data-safety page as cards and added "Change data location" to migrate data manually; takes effect after restart
            - Preserved 2.2.x data compatibility; release packages contain no personal models, API keys, voice samples, or usage history
          overwrite_files: true
          files: release-files/*
