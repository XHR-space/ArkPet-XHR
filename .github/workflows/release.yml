name: Build Windows and macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run dist:ci

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe

  build-macos:
    name: build-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Confirm build architecture
        run: |
          uname -m
          test "$(node -p "process.arch")" = "${{ matrix.arch }}"

      - name: Install dependencies with optional native packages
        run: npm ci --include=optional

      - name: Verify native dependencies
        run: |
          test -d "node_modules/@img/sharp-darwin-${{ matrix.arch }}"
          test -d "node_modules/@img/sharp-libvips-darwin-${{ matrix.arch }}"

      - name: Build macOS installer
        run: npm run check && npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Verify packaged runtime
        env:
          EXPECTED_MAC_ARCH: ${{ matrix.arch }}
        run: |
          app="$(find release -name '*.app' -type d -print -quit)"
          test -n "$app"
          test -d "$app/Contents/Resources/app/node_modules/@img/sharp-darwin-${{ matrix.arch }}"
          test -d "$app/Contents/Resources/app/node_modules/@img/sharp-libvips-darwin-${{ matrix.arch }}"
          binary="$(find "$app/Contents/MacOS" -type f -print -quit)"
          ELECTRON_RUN_AS_NODE=1 "$binary" "$app/Contents/Resources/app/scripts/verify-sharp.cjs"

      - name: Upload macOS ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: release/*.dmg

  publish-release:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: package
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: ArkPet ${{ steps.package.outputs.version }}
          body: |
            ArkPet ${{ steps.package.outputs.version }}

            【中文说明】
            ArkPet 2.2.0 修复更新，Windows 与 macOS 安装包均已提供。

            主要变更：
            - 修复高级设置中角色位置、显示画面和碰撞框的定位与保存问题，恢复稳定的桌面坐标链路
            - 修复拖动后位置回弹、角色显示到屏幕或任务栏下方、慢速松手不受重力影响的问题
            - 恢复稳定的拖动、抛掷、弹跳、落地与最终位置保存行为
            - “文字对话”恢复为角色头顶的内联文字框，并调整到更靠近角色的位置；发送、流式回复、AI 和焦点功能保持不变
            - 改进全局拖动捕获与退出清理，减少拖动中断和角色冻结
            - 保持 2.1.x 用户数据目录和更新兼容性；发行包不包含个人模型、API 密钥、声音样本或使用记录

            【English】
            ArkPet 2.2.0 is a maintenance update. Windows and macOS installers are included.

            Highlights:
            - Fixed character position, display frame, and hitbox positioning and persistence in advanced settings
            - Fixed position snap-back, characters rendering below the desktop area, and slow drag releases ignoring gravity
            - Restored reliable drag, throw, bounce, landing, and final-position persistence behavior
            - Restored the inline text chat panel above the character and moved it closer; sending, streaming replies, AI, and focus behavior are unchanged
            - Improved global drag capture and shutdown cleanup to reduce interrupted drags and frozen characters
            - Preserved 2.1.x user-data paths and update compatibility; release packages contain no personal models, API keys, voice samples, or usage history
          overwrite_files: true
          files: release-files/*
