name: Build Windows and macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run dist:ci

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe

  build-macos:
    name: build-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Confirm build architecture
        run: |
          uname -m
          test "$(node -p "process.arch")" = "${{ matrix.arch }}"

      - name: Install dependencies with optional native packages
        run: npm ci --include=optional

      - name: Verify native dependencies
        run: |
          test -d "node_modules/@img/sharp-darwin-${{ matrix.arch }}"
          test -d "node_modules/@img/sharp-libvips-darwin-${{ matrix.arch }}"

      - name: Build macOS installer
        run: npm run check && npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Verify packaged runtime
        env:
          EXPECTED_MAC_ARCH: ${{ matrix.arch }}
        run: |
          app="$(find release -name '*.app' -type d -print -quit)"
          test -n "$app"
          test -d "$app/Contents/Resources/app/node_modules/@img/sharp-darwin-${{ matrix.arch }}"
          test -d "$app/Contents/Resources/app/node_modules/@img/sharp-libvips-darwin-${{ matrix.arch }}"
          binary="$(find "$app/Contents/MacOS" -type f -print -quit)"
          ELECTRON_RUN_AS_NODE=1 "$binary" "$app/Contents/Resources/app/scripts/verify-sharp.cjs"

      - name: Upload macOS ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: release/*.dmg

  publish-release:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: package
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: ArkPet ${{ steps.package.outputs.version }}
          body: |
            ArkPet ${{ steps.package.outputs.version }}

            【中文说明】
            ArkPet 2.1.0 功能更新，Windows 与 macOS 安装包均已提供。

            主要变更：
            - 重构桌宠桌面交互：点击、拖动和右键不再穿透或被全屏覆盖层截获，其他软件画面保持正常刷新
            - 每只角色使用独立交互区域；右键菜单、自动文字气泡和语音提示按角色可见位置稳定显示
            - 新增按角色独立的完整文字聊天页；右键“文字对话”打开普通窗口，自动文字继续使用紧凑气泡，聊天记录互不串用
            - 高级设置改为复用 Spine/Pixi 画布；统一显示画面、角色和碰撞区域坐标，调整碰撞不再移动角色，调整角色位置会同步移动碰撞框
            - 完善高级设置草稿、Esc 取消、切换角色保存/放弃/取消、未保存离开提醒和显式保存流程
            - 修复聊天窗口加载失败或渲染进程退出时角色永久冻结的问题
            - 保持 2.0.x 用户数据目录和更新兼容性；发行包不包含个人模型、API 密钥、声音样本或使用记录

            【English】
            ArkPet 2.1.0 is a feature update. Windows and macOS installers are included.

            Highlights:
            - Reworked desktop interaction so clicks, drags, and context menus no longer pass through or get captured by the full-screen overlay; other applications keep refreshing normally
            - Added an independent interaction region per character, with context menus, automatic text bubbles, and voice indicators anchored to the visible character
            - Added a per-character full text chat window; context-menu text chat opens a normal window while automatic text keeps the compact bubble, with isolated chat histories
            - Advanced settings now reuse the Spine/Pixi canvas; display frame, character, and hitbox coordinates are unified, collision edits no longer move the character, and position edits move the hitbox with it
            - Added advanced-settings drafts, Escape cancellation, save/discard/cancel role switching, unsaved-exit protection, and explicit save flow
            - Fixed characters remaining frozen when a chat window failed to load or its renderer exited
            - Preserved 2.0.x user-data paths and update compatibility; release packages contain no personal models, API keys, voice samples, or usage history
          overwrite_files: true
          files: release-files/*
